services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rbs
      POSTGRES_PASSWORD: rbs_dev_password
      POSTGRES_DB: rbs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rbs_pgdata:/var/lib/postgresql/data
      - ../backend/src/db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
volumes:
  rbs_pgdata:
