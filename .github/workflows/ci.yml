name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rbs
          POSTGRES_PASSWORD: rbs_dev_password
          POSTGRES_DB: rbs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rbs -d rbs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Ajustar rol PostgreSQL para RLS
        env:
          PGPASSWORD: rbs_dev_password
        run: psql -h 127.0.0.1 -p 5433 -U rbs -d rbs_test -v ON_ERROR_STOP=1 -c "ALTER ROLE rbs NOSUPERUSER"
      - run: npm run typecheck
      - run: npm test --if-present
        env:
          DATABASE_URL: postgres://rbs:rbs_dev_password@127.0.0.1:5433/rbs_test
          PG_TEST_URL: postgres://rbs:rbs_dev_password@127.0.0.1:5433/rbs_test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleStandardDebug :app:testStandardDebugUnitTest
